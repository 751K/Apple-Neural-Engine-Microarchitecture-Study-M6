<rect x="1041" y="286" width="21" height="30" fill="#276354" stroke="#1a1a1a" stroke-width="1.5"/>
<text class="m mid" x="400.5" y="334">31</text>
<text class="m mid" x="421.5" y="334">30</text>
<text class="m mid" x="715.5" y="334">16</text>
<text class="m mid" x="736.5" y="334">15</text>
<text class="m mid" x="1051.5" y="334">0</text>
<text class="c mid" x="400.5" y="356">Sign</text>
<text class="c mid" x="568.5" y="356">Integer 15 bits: |v| &lt; 2¹⁵ = 32768</text>
<text class="c mid" x="904.5" y="356">Fraction 16 bits: LSB = 2⁻¹⁶</text>
<text class="c" x="370" y="380">|v| reaching 32768 at any time → inf, never recovers; no FP16 partial sums during accumulation.</text>
<path d="M1110 315 H1156" stroke="#bbbbbd" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="1160" y="240" width="240" height="150" rx="10" fill="#205347" stroke="#1dffdc" stroke-width="1.5"/>
<text class="h mid" x="1280" y="268">Convert to FP16</text>
<text class="b mid" x="1280" y="298">Round, ties away from 0</text>
<text class="c mid" x="1280" y="320">(not IEEE ties-to-even)</text>
<text class="m mid" x="1280" y="346">2049 → 2050</text>
<text class="m mid" x="1280" y="368">−0 → +0</text>
<text class="h" x="40" y="446">Comparison of three datapaths</text>
<rect x="40" y="464" width="440" height="150" rx="10" fill="#262f4c" stroke="#6b87c3" stroke-width="1.5"/>
<text class="h" x="60" y="496">FP16 conv / matmul</text>
<text class="b" x="60" y="528">32-bit fixed-point Q15.16 (above)</text>
<text class="b" x="60" y="556">Range |v| &lt; 32768, resolution 2⁻¹⁶</text>
<text class="b" x="60" y="584">Overflow → inf</text>
<text class="c end" x="460" y="600">Sec. 8.2</text>
<rect x="500" y="464" width="440" height="150" rx="10" fill="#262f4c" stroke="#6b87c3" stroke-width="1.5"/>
<text class="h" x="520" y="496">INT8 conv (W8A8)</text>
<text class="b" x="520" y="528">32-bit int accumulation, scaled afterwards</text>
<text class="b" x="520" y="556">Can exceed 32768 (e.g. 64512)</text>
<text class="b" x="520" y="584">S ≥ 2³¹: overflow → inf</text>
<text class="c end" x="920" y="600">Sec. 8.3</text>
<rect x="960" y="464" width="440" height="150" rx="10" fill="#22222a" stroke="#818187" stroke-width="1.5"/>
<text class="h" x="980" y="496">Elementwise (PE)</text>
<text class="b" x="980" y="528">FP16 floating point</text>
<text class="b" x="980" y="556">Keeps subnormals (e.g. 2⁻²⁴)</text>
<text class="b" x="980" y="584">Above FP16 max → inf</text>
<text class="c end" x="1380" y="600">Sec. 8.4</text>
</svg>