<rect x="579" y="286" width="21" height="30" fill="#323f61" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="600" y="286" width="21" height="30" fill="#323f61" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="621" y="286" width="21" height="30" fill="#323f61" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="642" y="286" width="21" height="30" fill="#323f61" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="663" y="286" width="21" height="30" fill="#323f61" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="684" y="286" width="21" height="30" fill="#323f61" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="705" y="286" width="21" height="30" fill="#323f61" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="726" y="286" width="21" height="30" fill="#276354" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="747" y="286" width="21" height="30" fill="#276354" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="768" y="286" width="21" height="30" fill="#276354" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="789" y="286" width="21" height="30" fill="#276354" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="810" y="286" width="21" height="30" fill="#276354" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="831" y="286" width="21" height="30" fill="#276354" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="852" y="286" width="21" height="30" fill="#276354" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="873" y="286" width="21" height="30" fill="#276354" stroke="#1a1a1a" stroke-width="1.5"/>
