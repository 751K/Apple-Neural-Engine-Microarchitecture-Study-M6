<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" font-family="Helvetica Neue, PingFang SC, Arial, sans-serif">
<rect x="0" y="0" width="1440" height="640" fill="#161618"/>
<style>text{fill:#dbdbde} .h{font-size:18px;font-weight:600} .b{font-size:14.5px;fill:#c6c6c8} .c{font-size:13px;fill:#9c9ca0} .m{font-size:13px;font-family:Menlo,SF Mono,monospace;fill:#c6c6c8} .mid{text-anchor:middle} .end{text-anchor:end}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bbbbbd"/></marker></defs>
<text class="h" x="40" y="30">FP16 conv and matmul datapath</text>
<rect x="40" y="52" width="130" height="50" rx="10" fill="#1a1a1a" stroke="#818187" stroke-width="1.5"/>
<text class="b mid" x="105" y="83">x (FP16)</text>
<rect x="40" y="118" width="130" height="50" rx="10" fill="#1a1a1a" stroke="#818187" stroke-width="1.5"/>
<text class="b mid" x="105" y="149">w (FP16)</text>
<rect x="220" y="52" width="300" height="116" rx="10" fill="#22222a" stroke="#818187" stroke-width="1.5"/>
<text class="h mid" x="370" y="80">Input decode</text>
<text class="c mid" x="370" y="106">All-ones exponent decoded as normal:</text>
<text class="c mid" x="370" y="126">+inf → 2¹⁶, NaN 0x7E00 → 1.5 × 2¹⁶</text>
<text class="c mid" x="370" y="148">inf comes from accumulator overflow</text>
<path d="M170 77 H216" stroke="#bbbbbd" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<path d="M170 143 H216" stroke="#bbbbbd" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="570" y="52" width="260" height="116" rx="10" fill="#262f4c" stroke="#6b87c3" stroke-width="1.5"/>
<text class="h mid" x="700" y="80">Multiply</text>
<text class="b mid" x="700" y="108">Mantissa product ∈ [1, 4)</text>
<text class="b mid" x="700" y="130">Exponent sum e</text>
<text class="c mid" x="700" y="152">(inferred internal form)</text>
<path d="M520 110 H566" stroke="#bbbbbd" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="880" y="52" width="520" height="116" rx="10" fill="#262f4c" stroke="#6b87c3" stroke-width="1.5"/>
<text class="h mid" x="1140" y="80">Align to 2⁻¹⁶</text>
<text class="b" x="900" y="110">e ≥ −16:</text>
<text class="b" x="980" y="110">round (ties away from 0), add to accumulator</text>
<text class="b" x="900" y="136">e ≤ −17:</text>
<text class="b" x="980" y="136">whole product dropped, even if ≈ 2 LSB</text>
<text class="c" x="900" y="158">Subnormal exponent taken as −14</text>
<path d="M830 110 H876" stroke="#bbbbbd" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<path d="M1000 168 V236" stroke="#bbbbbd" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="40" y="240" width="260" height="150" rx="10" fill="#22222a" stroke="#818187" stroke-width="1.5"/>
<text class="h mid" x="170" y="268">Bias b (FP16)</text>
<text class="b mid" x="170" y="296">Round to 2⁻¹⁶ (away from 0)</text>
<text class="b mid" x="170" y="318">as accumulator init</text>
<text class="c mid" x="170" y="346">Large negative bias offsets products,</text>
<text class="c mid" x="170" y="366">avoiding overflow</text>
<path d="M300 315 H346" stroke="#bbbbbd" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="350" y="240" width="760" height="150" rx="10" fill="#493725" stroke="#b79578" stroke-width="1.5"/>
<text class="h" x="370" y="268">Accumulator: 32-bit fixed-point Q15.16</text>
<rect x="390" y="286" width="21" height="30" fill="#642e26" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="411" y="286" width="21" height="30" fill="#323f61" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="432" y="286" width="21" height="30" fill="#323f61" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="453" y="286" width="21" height="30" fill="#323f61" stroke="#1a1a1a" stroke-width="1.5"/>
