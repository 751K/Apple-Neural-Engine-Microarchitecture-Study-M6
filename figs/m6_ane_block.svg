<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" font-family="PingFang SC, Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .box { fill: #ffffff; stroke: #333; stroke-width: 1.2; rx: 6; }
    .eng { fill: #f4f7fb; stroke: #4a6fa5; stroke-width: 1.6; rx: 10; }
    .host { fill: #fbf7f0; stroke: #a5824a; stroke-width: 1.4; rx: 10; }
    .mem { fill: #f3f8f2; stroke: #4f8a4a; stroke-width: 1.4; rx: 10; }
    .ne { fill: #e3ecf7; stroke: #4a6fa5; stroke-width: 1; }
    .t { font-weight: 600; }
    .s { font-size: 11px; fill: #444; }
    .k { font-size: 11px; fill: #a03030; }
    .arr { stroke: #333; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .sync { stroke: #a03030; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#ar); marker-start: url(#arl); }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a03030"/></marker>
    <marker id="arl" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#a03030"/></marker>
  </defs>

  <text x="590" y="28" text-anchor="middle" font-size="18" class="t">Apple M6 神经网络引擎（h18g）结构示意</text>
  <text x="590" y="48" text-anchor="middle" class="s">根据本项目的实测、编译产物与参数表推断；数字均为 M6 实测值，证据来源见底部</text>

  <!-- 主机侧 -->
  <rect x="20" y="66" width="1140" height="86" class="host"/>
  <text x="34" y="86" class="t">主机侧（CPU）</text>
  <rect x="34" y="96" width="190" height="44" class="box"/>
  <text x="129" y="114" text-anchor="middle">Core ML / e5rt</text>
  <text x="129" y="130" text-anchor="middle" class="s">首次加载时请求编译</text>
  <rect x="244" y="96" width="250" height="44" class="box"/>
  <text x="369" y="114" text-anchor="middle">aned + ANECompiler</text>
  <text x="369" y="130" text-anchor="middle" class="s">生成 nonbonded + bonded 两套程序</text>
  <rect x="514" y="96" width="250" height="44" class="box"/>
  <text x="639" y="114" text-anchor="middle">IOKit 驱动（H11ANEIn）</text>
  <text x="639" y="130" text-anchor="middle" class="s">提交请求、处理中断（2–3 次/调用）</text>
  <rect x="784" y="96" width="362" height="44" class="box"/>
  <text x="965" y="114" text-anchor="middle">每次调用固定开销 ≈150 µs + 0.48 µs/层</text>
  <text x="965" y="130" text-anchor="middle" class="s">（kdebug）；并发请求由内核派到空闲引擎（1.78×）</text>
  <path d="M224,118 L244,118" class="arr"/>
  <path d="M494,118 L514,118" class="arr"/>

  <!-- 两个引擎 -->
  <g id="eng0">
    <rect x="20" y="172" width="560" height="470" class="eng"/>
    <text x="34" y="194" class="t">ANE0（ane@19600000）</text>
    <text x="566" y="194" text-anchor="end" class="s">独立电源门控 · 与 ANE1 共用时钟</text>

    <rect x="34" y="206" width="250" height="42" class="box"/>
    <text x="159" y="223" text-anchor="middle">IOP 固件处理器</text>
    <text x="159" y="239" text-anchor="middle" class="s">空闲约 6 s 后断电，唤醒约 50 ms</text>
    <rect x="296" y="206" width="270" height="42" class="box"/>
    <text x="431" y="223" text-anchor="middle">TD 取指（TDBASE）</text>
    <text x="431" y="239" text-anchor="middle" class="s">任务描述符逐个串行执行（不重叠）</text>

    <rect x="34" y="262" width="168" height="62" class="box"/>
    <text x="118" y="281" text-anchor="middle">Tile DMA（入）</text>
    <text x="118" y="297" text-anchor="middle" class="s">两路源，可双倍速率</text>
    <text x="118" y="313" text-anchor="middle" class="s">激活读写 ≈40 GB/s</text>
    <rect x="214" y="262" width="168" height="62" class="box"/>
    <text x="298" y="281" text-anchor="middle">Kernel DMA</text>
    <text x="298" y="297" text-anchor="middle" class="s">16 组，每 NE 一组</text>
    <text x="298" y="313" text-anchor="middle" class="s">读权重 130 / 150 GB/s</text>
    <rect x="394" y="262" width="172" height="62" class="box"/>
    <text x="480" y="281" text-anchor="middle">纹理 / gather 单元</text>
    <text x="480" y="297" text-anchor="middle" class="s">上采样、gather</text>
    <text x="480" y="313" text-anchor="middle" class="s">（TD 字段 0x45c–0x47c）</text>

    <rect x="34" y="338" width="532" height="52" class="box"/>
    <text x="300" y="358" text-anchor="middle">L2 片上暂存区（编译器管理，64 bank）</text>
    <text x="300" y="376" text-anchor="middle" class="s">中间张量每块 &lt; 2 MiB；长链按块融合，中间结果不回 DRAM；环形缓冲</text>

    <rect x="34" y="404" width="532" height="118" class="box"/>
    <text x="300" y="422" text-anchor="middle">16 × NE（MAC 阵列）</text>
    <g>
      <rect x="44" y="430" width="28" height="22" class="ne"/><rect x="76" y="430" width="28" height="22" class="ne"/>
      <rect x="108" y="430" width="28" height="22" class="ne"/><rect x="140" y="430" width="28" height="22" class="ne"/>
      <rect x="172" y="430" width="28" height="22" class="ne"/><rect x="204" y="430" width="28" height="22" class="ne"/>
      <rect x="236" y="430" width="28" height="22" class="ne"/><rect x="268" y="430" width="28" height="22" class="ne"/>
      <rect x="300" y="430" width="28" height="22" class="ne"/><rect x="332" y="430" width="28" height="22" class="ne"/>
      <rect x="364" y="430" width="28" height="22" class="ne"/><rect x="396" y="430" width="28" height="22" class="ne"/>
      <rect x="428" y="430" width="28" height="22" class="ne"/><rect x="460" y="430" width="28" height="22" class="ne"/>
      <rect x="492" y="430" width="28" height="22" class="ne"/><rect x="524" y="430" width="28" height="22" class="ne"/>
    </g>
    <text x="300" y="472" text-anchor="middle" class="s">按输出通道平均分给 16 个 NE（Cout ≥ 16 时全部启用）</text>
    <text x="300" y="489" text-anchor="middle" class="k">累加器：32 位定点 Q15.16，|和| ≥ 32768 → inf；输出右移 + 远离零舍入 → fp16</text>
    <text x="300" y="506" text-anchor="middle" class="s">FP16 ≈20.6 TFLOPS（单引擎）· W8A8 约 1.7× · 无 Winograd · 长条形核效率低</text>

    <rect x="34" y="536" width="268" height="92" class="box"/>
    <text x="168" y="554" text-anchor="middle">平面引擎 PE</text>
    <text x="168" y="572" text-anchor="middle" class="s">逐元素：2 位操作码（加 / 乘 / 大 / 小）+ 取反</text>
    <text x="168" y="588" text-anchor="middle" class="s">33 点 LUT（对称、区间归约）</text>
    <text x="168" y="604" text-anchor="middle" class="s">浮点路径：fp16 全范围、保留非规格化数</text>
    <text x="168" y="620" text-anchor="middle" class="s">与 MAC 不同时工作（串行）</text>
    <rect x="314" y="536" width="252" height="92" class="box"/>
    <text x="440" y="554" text-anchor="middle">L2 结果写回 → Tile DMA（出）</text>
    <text x="440" y="574" text-anchor="middle" class="s">格式、交织、压缩、裁剪</text>
    <text x="440" y="592" text-anchor="middle" class="s">（TD 字段 0x69c–0x71c）</text>
  </g>

  <g transform="translate(580,0)">
    <rect x="20" y="172" width="560" height="470" class="eng"/>
    <text x="34" y="194" class="t">ANE1（ane1@81600000）</text>
    <text x="566" y="194" text-anchor="end" class="s">结构与 ANE0 相同（16 NE）</text>
    <rect x="34" y="206" width="532" height="420" class="box" style="fill:#f9fbfd"/>
    <text x="300" y="300" text-anchor="middle" class="t">同 ANE0</text>
    <text x="300" y="330" text-anchor="middle" class="s">IOP · TD 取指 · Tile / Kernel DMA · 纹理单元</text>
    <text x="300" y="350" text-anchor="middle" class="s">L2 · 16 × NE · PE · 写回</text>
    <text x="300" y="400" text-anchor="middle">bonded 模式下的分工</text>
    <text x="300" y="420" text-anchor="middle" class="s">编译器按空间（H 或 W）把一层切成两半，两边用同一份权重</text>
    <text x="300" y="438" text-anchor="middle" class="s">（各自读一份 → 权重流量翻倍）</text>
    <text x="300" y="456" text-anchor="middle" class="s">切分阈值：H=1 时宽 128 → 256 之间</text>
    <text x="300" y="474" text-anchor="middle" class="s">归约类运算：ANE1 算部分和，ANE0 汇总并负责输入输出</text>
    <text x="300" y="506" text-anchor="middle" class="t">两个引擎合计 FP16 ≈39.5 TFLOPS（1.92×）</text>
    <text x="300" y="530" text-anchor="middle" class="s">双引擎满载：ANE 电源轨 PP0b ≈11.3 W（SMC）</text>
    <text x="300" y="548" text-anchor="middle" class="s">单引擎满载 ≈6.5 W；空闲 0 W</text>
    <text x="300" y="580" text-anchor="middle" class="s">时钟从空闲爬升约 0.3 s（慢 2.8×）；5 分钟满载不降频</text>
  </g>

  <!-- 跨引擎同步 -->
  <path d="M566,470 L614,470" class="sync"/>
  <text x="590" y="458" text-anchor="middle" class="k">屏障</text>
  <text x="590" y="492" text-anchor="middle" class="k">f0003281</text>

  <!-- 内存侧 -->
  <rect x="20" y="660" width="1140" height="184" class="mem"/>
  <text x="34" y="680" class="t">共享内存路径</text>
  <rect x="34" y="692" width="350" height="56" class="box"/>
  <text x="209" y="712" text-anchor="middle">每个引擎两条链路 L0 / L1 → 片上互连（AF）</text>
  <text x="209" y="730" text-anchor="middle" class="s">两条链路各承担一半流量（IOReport PMP DCS BW）</text>
  <rect x="404" y="692" width="370" height="56" class="box"/>
  <text x="589" y="712" text-anchor="middle">系统级缓存 SLC（按 DSID 打标签）</text>
  <text x="589" y="730" text-anchor="middle" class="s">bonded 共享暂存区（alloc_bss_for_ane16383）经此交换数据</text>
  <rect x="794" y="692" width="352" height="56" class="box"/>
  <text x="970" y="712" text-anchor="middle">DRAM（两个引擎共享）</text>
  <text x="970" y="730" text-anchor="middle" class="s">双引擎合计读权重 ≈140 GB/s，不随引擎数翻倍</text>
  <path d="M384,720 L404,720" class="arr"/>
  <path d="M774,720 L794,720" class="arr"/>
  <text x="590" y="776" text-anchor="middle" class="k">单次调用读权重总量 ≈48 MiB 处切换：≤48 MiB 约 130 GB/s；≥50 MiB 每次调用 +55 µs、约 145–152 GB/s（运行时 / 固件开关，机制未明）</text>
  <text x="590" y="800" text-anchor="middle" class="s">片上常驻权重很小：每层 4.5 MB 时，即使各层共用一份权重也要每层重新读取</text>
  <text x="590" y="824" text-anchor="middle" class="s">证据：IOReport（中断、链路、电源状态）· SMC（PP0b）· kdebug（anemon）· 编译产物（anecc）· 参数表 · 计时（Core ML）</text>

  <path d="M300,642 L300,692" class="arr"/>
  <path d="M880,642 L880,692" class="arr"/>
  <path d="M300,152 L300,172" class="arr"/>
  <path d="M880,152 L880,172" class="arr"/>
</svg>
