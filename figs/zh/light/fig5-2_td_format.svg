<text x="988" y="608" class="ms" text-anchor="middle">值</text>
<text x="1090" y="599" class="s" text-anchor="start">DSID 参数（寄存器 0x1344），BAR 20</text>
<text x="1090" y="618" class="xs" text-anchor="start">系统级缓存的数据流标签</text>
<rect x="820" y="634" width="140" height="44" fill="#efe8e1" stroke="#7e6148" stroke-width="1.6"/>
<text x="890" y="662" class="m" text-anchor="middle">23009444</text>
<rect x="960" y="634" width="56" height="44" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="988" y="662" class="ms" text-anchor="middle">Lo</text>
<rect x="1016" y="634" width="56" height="44" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="1044" y="662" class="ms" text-anchor="middle">Hi</text>
<text x="1090" y="653" class="s" text-anchor="start">输出（寄存器 0x1444），BAR 24</text>
<text x="1090" y="672" class="xs" text-anchor="start">每次调用时由运行时按 BAR 填入</text>
<rect x="820" y="688" width="140" height="44" fill="#efe8e1" stroke="#7e6148" stroke-width="1.6"/>
<text x="890" y="716" class="m" text-anchor="middle">23809346</text>
<rect x="960" y="688" width="56" height="44" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="988" y="716" class="ms" text-anchor="middle">Lo</text>
<rect x="1016" y="688" width="56" height="44" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="1044" y="716" class="ms" text-anchor="middle">Hi</text>
<text x="1090" y="707" class="s" text-anchor="start">输入（寄存器 0x1346），BAR 28</text>
<text x="1090" y="726" class="xs" text-anchor="start">24 起每个张量 4 个槽位，先输出后输入</text>
<text x="70" y="790" class="s" text-anchor="start">② 中的写入包按以下寄存器组的顺序排列（字段偏移，表 5-8），这一顺序与硬件中的数据流向一致：</text>
