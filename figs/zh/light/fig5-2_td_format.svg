<text x="376.0" y="854" class="xs" text-anchor="middle">Tile DMA</text>
<rect x="484" y="804" width="198" height="64" fill="#e3f4f0" stroke="#00a087" stroke-width="1.6"/>
<text x="583.0" y="832" class="n" text-anchor="middle">纹理 / gather</text>
<text x="583.0" y="854" class="xs" text-anchor="middle">重采样</text>
<rect x="691" y="804" width="198" height="64" fill="#e3f4f0" stroke="#00a087" stroke-width="1.6"/>
<text x="790.0" y="832" class="n" text-anchor="middle">L2 源</text>
<text x="790.0" y="854" class="xs" text-anchor="middle">环形缓冲</text>
<rect x="898" y="804" width="198" height="64" fill="#e7eaf3" stroke="#3c5488" stroke-width="1.6"/>
<text x="997.0" y="832" class="n" text-anchor="middle">PE</text>
<text x="997.0" y="854" class="xs" text-anchor="middle">逐元素</text>
<rect x="1105" y="804" width="198" height="64" fill="#e7eaf3" stroke="#3c5488" stroke-width="1.6"/>
<text x="1204.0" y="832" class="n" text-anchor="middle">NE</text>
<text x="1204.0" y="854" class="xs" text-anchor="middle">卷积配置 · 移位</text>
<rect x="1312" y="804" width="198" height="64" fill="#e1f3f8" stroke="#2f9ab5" stroke-width="1.6"/>
<text x="1411.0" y="832" class="n" text-anchor="middle">输出</text>
<text x="1411.0" y="854" class="xs" text-anchor="middle">Tile DMA</text>
<line x1="277" y1="890" x2="1520" y2="890" stroke="#48484a" stroke-width="2" marker-end="url(#a)"/>
<text x="860" y="914" class="xs" text-anchor="middle">DRAM → 输入 Tile DMA → L2 → NE / PE → 输出 Tile DMA → DRAM</text>
<text x="70" y="960" class="n" text-anchor="start">④ 包头字的逐位解码：以 ②、③ 中的三个包头字为例（32 位，左为 bit 31）</text>
