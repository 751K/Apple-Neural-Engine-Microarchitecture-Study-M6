<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1290" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<style>text{fill:#1d1d1f} .t{font-size:24px;font-weight:600} .n{font-size:18px} .m{font-size:17px;font-family:Menlo,SF Mono,monospace} .ms{font-size:14px;font-family:Menlo,SF Mono,monospace;fill:#3a3a3c} .s{font-size:15px;fill:#48484a} .xs{font-size:13px;fill:#6e6e73}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#48484a" stroke-width="1.6"/></marker></defs>
<text x="60" y="40" class="t" text-anchor="start">TD 序列（每个 ANE 一段）</text>
<rect x="60" y="60" width="150" height="62" fill="#f5f5f7" stroke="#8e8e93" stroke-width="1.6"/>
<text x="135" y="86" class="s" text-anchor="middle">序列头（4 字）</text>
<text x="135" y="108" class="ms" text-anchor="middle">1 0 0 0</text>
<rect x="222" y="60" width="170" height="62" fill="#fbe3df" stroke="#e64b35" stroke-width="1.6"/>
<text x="307" y="98" class="n" text-anchor="middle">TD 0（展开见下）</text>
<rect x="404" y="60" width="120" height="62" fill="#fbe3df" stroke="#e64b35" stroke-width="1.6" opacity="0.75"/>
<text x="464" y="98" class="n" text-anchor="middle">TD 1</text>
<rect x="536" y="60" width="120" height="62" fill="#fbe3df" stroke="#e64b35" stroke-width="1.6" opacity="0.75"/>
<text x="596" y="98" class="n" text-anchor="middle">TD 2</text>
<text x="690" y="98" class="n" text-anchor="middle" fill="#6e6e73">⋯</text>
<rect x="714" y="60" width="130" height="62" fill="#fbe3df" stroke="#e64b35" stroke-width="1.6" opacity="0.75"/>
<text x="779" y="98" class="n" text-anchor="middle">TD n − 1</text>
<text x="874" y="78" class="s" text-anchor="start">每层对应一个或多个 TD。单 ANE 程序一段，</text>
<text x="874" y="100" class="s" text-anchor="start">双 ANE 程序中 ANE0、ANE1 各一段（5.8 节）。</text>
<text x="874" y="122" class="s" text-anchor="start">TD 内没有指令和分支，只有寄存器写入。</text>
<line x1="307" y1="122" x2="307" y2="146" stroke="#48484a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="40" y="150" width="1520" height="1110" rx="16" fill="none" stroke="#8e8e93" stroke-width="1.2"/>
<text x="70" y="190" class="t" text-anchor="start">一个 TD（v24 布局）</text>
<text x="70" y="226" class="s" text-anchor="start">TD 在内存中是一串 32 位字，依次为任务头、若干写入包和若干地址包；每个包由 1 个包头字和随后的 n 个值字组成。</text>
<rect x="70" y="240" width="300" height="40" fill="#ececee" stroke="#6e6e73" stroke-width="1.6"/>
<text x="220" y="266" class="s" text-anchor="middle">任务头（12 字）</text>
<rect x="370" y="240" width="34" height="40" fill="#e5e5ea" stroke="#636366" stroke-width="1.6"/>
<text x="387" y="266" class="xs" text-anchor="middle">头</text>
<rect x="404" y="240" width="66" height="40" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="437" y="266" class="xs" text-anchor="middle">3 个值</text>
<rect x="470" y="240" width="34" height="40" fill="#e5e5ea" stroke="#636366" stroke-width="1.6"/>
<text x="487" y="266" class="xs" text-anchor="middle">头</text>
