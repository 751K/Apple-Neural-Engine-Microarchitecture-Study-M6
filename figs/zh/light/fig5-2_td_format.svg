<text x="631" y="266" class="xs" text-anchor="middle">头</text>
<rect x="648" y="240" width="66" height="40" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="681" y="266" class="xs" text-anchor="middle">3 个值</text>
<rect x="714" y="240" width="34" height="40" fill="#e5e5ea" stroke="#636366" stroke-width="1.6"/>
<text x="731" y="266" class="xs" text-anchor="middle">头</text>
<rect x="748" y="240" width="132" height="40" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="814" y="266" class="xs" text-anchor="middle">6 个值</text>
<rect x="880" y="240" width="34" height="40" fill="#e5e5ea" stroke="#636366" stroke-width="1.6"/>
<text x="897" y="266" class="xs" text-anchor="middle">头</text>
<rect x="914" y="240" width="88" height="40" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="958" y="266" class="xs" text-anchor="middle">4 个值</text>
<rect x="1002" y="240" width="90" height="40" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6" opacity="0.6"/>
<text x="1047" y="266" class="n" text-anchor="middle">⋯</text>
<rect x="1092" y="240" width="34" height="40" fill="#efe8e1" stroke="#7e6148" stroke-width="1.6"/>
<text x="1109" y="266" class="xs" text-anchor="middle">头</text>
<rect x="1126" y="240" width="60" height="40" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<rect x="1186" y="240" width="34" height="40" fill="#efe8e1" stroke="#7e6148" stroke-width="1.6"/>
<text x="1203" y="266" class="xs" text-anchor="middle">头</text>
<rect x="1220" y="240" width="30" height="40" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<rect x="1250" y="240" width="34" height="40" fill="#efe8e1" stroke="#7e6148" stroke-width="1.6"/>
<text x="1267" y="266" class="xs" text-anchor="middle">头</text>
<rect x="1284" y="240" width="60" height="40" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<rect x="1344" y="240" width="34" height="40" fill="#efe8e1" stroke="#7e6148" stroke-width="1.6"/>
<text x="1361" y="266" class="xs" text-anchor="middle">头</text>
<rect x="1378" y="240" width="60" height="40" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<path d="M72 286 v6 H368 v-6" stroke="#8e8e93" stroke-width="1.4" fill="none"/>
<text x="220.0" y="312" class="s" text-anchor="middle">①</text>
<path d="M372 286 v6 H1090 v-6" stroke="#8e8e93" stroke-width="1.4" fill="none"/>
<text x="731.0" y="312" class="s" text-anchor="middle">② 寄存器写入包</text>
<path d="M1094 286 v6 H1436 v-6" stroke="#8e8e93" stroke-width="1.4" fill="none"/>
<text x="1265.0" y="312" class="s" text-anchor="middle">③ 地址包</text>
<text x="70" y="350" class="n" text-anchor="start">① 任务头：12 个字（td_header0–11）</text>
<rect x="70" y="364" width="200" height="58" fill="#ececee" stroke="#6e6e73" stroke-width="1.6"/>
<text x="170.0" y="388" class="ms" text-anchor="middle">+0x0</text>
<text x="170.0" y="412" class="s" text-anchor="middle">tid · TaskSize</text>
<rect x="270" y="364" width="160" height="58" fill="#ececee" stroke="#6e6e73" stroke-width="1.6"/>
<text x="350.0" y="388" class="ms" text-anchor="middle">+0x4</text>
<text x="350.0" y="412" class="s" text-anchor="middle">exe_cycles</text>
<rect x="430" y="364" width="560" height="58" fill="#ececee" stroke="#6e6e73" stroke-width="1.6"/>
<text x="710.0" y="388" class="ms" text-anchor="middle">+0x8 … +0x1c</text>
<text x="710.0" y="412" class="s" text-anchor="middle">事件掩码：log / exception / debug / dram（6 字）</text>
<rect x="990" y="364" width="300" height="58" fill="#ececee" stroke="#6e6e73" stroke-width="1.6"/>
<text x="1140.0" y="388" class="ms" text-anchor="middle">+0x20</text>
<text x="1140.0" y="412" class="s" text-anchor="middle">标志字：Tsr · Tde · PublishBit</text>
<rect x="1290" y="364" width="240" height="58" fill="#ececee" stroke="#6e6e73" stroke-width="1.6" opacity="0.6"/>
<text x="1410.0" y="388" class="ms" text-anchor="middle">+0x24 … +0x2c</text>
<text x="1410.0" y="412" class="s" text-anchor="middle">其余 3 字</text>
<text x="70" y="446" class="xs" text-anchor="start">TaskSize 以字为单位给出本 TD 的长度；exe_cycles 是编译器性能模型的延迟估计（约 1 µs / 单位）；各字段见表 5-6。</text>
<text x="70" y="490" class="n" text-anchor="start">② 寄存器写入包：包头字说明写哪些寄存器，值字依次写入</text>
<text x="140" y="516" class="xs" text-anchor="middle">包头字</text>
<text x="336" y="516" class="xs" text-anchor="middle">值字（下方小字为目标寄存器）</text>
<rect x="70" y="526" width="140" height="50" fill="#e5e5ea" stroke="#636366" stroke-width="1.6"/>
<text x="140" y="557" class="m" text-anchor="middle">00010001</text>
<rect x="210" y="526" width="84" height="50" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="252.0" y="548" class="n" text-anchor="middle">Win</text>
<text x="252.0" y="568" class="xs" text-anchor="middle">寄存器 1</text>
<rect x="294" y="526" width="84" height="50" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="336.0" y="548" class="n" text-anchor="middle">Hin</text>
<text x="336.0" y="568" class="xs" text-anchor="middle">寄存器 2</text>
<rect x="378" y="526" width="84" height="50" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="420.0" y="548" class="n" text-anchor="middle">Cin</text>
<text x="420.0" y="568" class="xs" text-anchor="middle">寄存器 3</text>
<text x="560" y="548" class="s" text-anchor="start">连续写：从寄存器 1 起</text>
<text x="560" y="568" class="s" text-anchor="start">连续写 3 个值</text>
<rect x="70" y="590" width="140" height="50" fill="#e5e5ea" stroke="#636366" stroke-width="1.6"/>
<text x="140" y="621" class="m" text-anchor="middle">80c11340</text>
<rect x="210" y="590" width="84" height="50" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="252.0" y="612" class="n" text-anchor="middle">值</text>
<text x="252.0" y="632" class="xs" text-anchor="middle">寄存器 1340</text>
<rect x="294" y="590" width="84" height="50" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="336.0" y="612" class="n" text-anchor="middle">值</text>
<text x="336.0" y="632" class="xs" text-anchor="middle">寄存器 1342</text>
<rect x="378" y="590" width="84" height="50" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="420.0" y="612" class="n" text-anchor="middle">值</text>
<text x="420.0" y="632" class="xs" text-anchor="middle">寄存器 1348</text>
<rect x="462" y="590" width="84" height="50" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="504.0" y="612" class="n" text-anchor="middle">值</text>
<text x="504.0" y="632" class="xs" text-anchor="middle">寄存器 1349</text>
<text x="560" y="612" class="s" text-anchor="start">掩码写：写基址 0x1340，</text>
<text x="560" y="632" class="s" text-anchor="start">以及掩码选中的 3 个寄存器</text>
<text x="820" y="490" class="n" text-anchor="start">③ 地址包：值字是缓冲区内的偏移，BAR 编号指明是哪个缓冲区</text>
<text x="890" y="516" class="xs" text-anchor="middle">包头字</text>
<text x="1016" y="516" class="xs" text-anchor="middle">偏移（低 / 高 32 位）</text>
<rect x="820" y="526" width="140" height="44" fill="#efe8e1" stroke="#7e6148" stroke-width="1.6"/>
<text x="890" y="554" class="m" text-anchor="middle">20809544</text>
<rect x="960" y="526" width="56" height="44" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="988" y="554" class="ms" text-anchor="middle">Lo</text>
<rect x="1016" y="526" width="56" height="44" fill="#ffffff" stroke="#b8bcc6" stroke-width="1.6"/>
<text x="1044" y="554" class="ms" text-anchor="middle">Hi</text>
<text x="1090" y="545" class="s" text-anchor="start">权重（寄存器 0x1544），BAR 4</text>
<text x="1090" y="564" class="xs" text-anchor="start">加载时由静态重定位填入</text>
<rect x="820" y="580" width="140" height="44" fill="#efe8e1" stroke="#7e6148" stroke-width="1.6"/>
<text x="890" y="608" class="m" text-anchor="middle">22801344</text>
