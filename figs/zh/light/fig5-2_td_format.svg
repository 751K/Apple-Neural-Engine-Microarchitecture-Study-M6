<text x="1201.0" y="1156" class="n" text-anchor="middle">寄存器 = 0x1346</text>
<text x="270" y="1198" class="xs" text-anchor="start">bit 31 区分连续写（0）与掩码写（1）；掩码第 i 位为 1 时另写寄存器"基址 + 1 + i"；地址包以 bit 29 为标记，所有 64 位地址包的 BAR 编号都是偶数（表 5-7、5.7.6 节）。</text>
<text x="70" y="1244" class="xs" text-anchor="start">示例取自 256 通道、8×32 输入、4 层的 1×9 卷积在 h18g 上的产物（data/03_compile/tdv/h18g）。</text>
