<text x="327.0" y="1156" class="n" text-anchor="middle">0</text>
<rect x="346" y="1126" width="38" height="48" fill="#efe8e1" stroke="#7e6148" stroke-width="1.6"/>
<text x="365.0" y="1156" class="n" text-anchor="middle">1</text>
<rect x="384" y="1126" width="304" height="48" fill="#efe8e1" stroke="#7e6148" stroke-width="1.6"/>
