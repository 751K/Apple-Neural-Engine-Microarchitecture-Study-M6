# 构建报告网页（中文 site/，英文 site/en/）并部署到 GitHub Pages
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'final_report/zh.md'
      - 'final_report/en.md'
      - 'figs/zh/**'
      - 'figs/en/**'
      - 'tools/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown-it-py==2.2.0
      - run: |
          python3 tools/site/build.py --lang zh
          python3 tools/site/build.py --lang en
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
